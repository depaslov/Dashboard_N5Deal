&lt;body&gt;

&lt;div class=&quot;wrap&quot;&gt;

  &lt;header&gt;
    &lt;div class=&quot;kicker&quot;&gt;N5Deal · Monthly social &amp;amp; search performance&lt;/div&gt;
    &lt;h1&gt;August 2026&lt;/h1&gt;
    &lt;p class=&quot;lede&quot;&gt;Reach was the highest on record and almost none of it belonged to the company. Three founder profiles produced 95% of LinkedIn impressions, and three individual posts produced 81% of that. The profile with the least reach converted followers best. This is the baseline month — figures are recorded here so September has something to be measured against.&lt;/p&gt;
    &lt;div class=&quot;hmeta&quot;&gt;
      &lt;span&gt;Prepared by &lt;b&gt;Alina&lt;/b&gt;, Marketing Manager&lt;/span&gt;
      &lt;span&gt;Compiled &lt;b&gt;31 August 2026&lt;/b&gt;&lt;/span&gt;
      &lt;span&gt;Accounts covered &lt;b&gt;7&lt;/b&gt;&lt;/span&gt;
      &lt;span&gt;Comparison &lt;b&gt;baseline — no month-on-month deltas&lt;/b&gt;&lt;/span&gt;
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;!-- 1. AT A GLANCE --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sechead&quot;&gt;&lt;span class=&quot;secnum&quot;&gt;01&lt;/span&gt;&lt;h2&gt;The month at a glance&lt;/h2&gt;&lt;/div&gt;
    &lt;p class=&quot;secsub&quot;&gt;Totals across every active account. Export windows differ by platform — see method note at the foot of the page — so these are directional totals, not a like-for-like consolidation.&lt;/p&gt;
    &lt;div class=&quot;tiles&quot; id=&quot;tiles&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ops&quot;&gt;&lt;b&gt;Ops note ·&lt;/b&gt; ~30% of all impressions this month were paid: 6,622 sponsored on the company page and roughly 80,000 behind a single promoted post on Egor's profile. &lt;b&gt;Verify exact ad impressions and spend&lt;/b&gt; before this figure goes to the founders.&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 2. REACH BY ACCOUNT --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sechead&quot;&gt;&lt;span class=&quot;secnum&quot;&gt;02&lt;/span&gt;&lt;h2&gt;Where the reach actually came from&lt;/h2&gt;&lt;/div&gt;
    &lt;p class=&quot;secsub&quot;&gt;Impressions per account. The company page — the asset the business owns — sits fourth, behind all three founder profiles.&lt;/p&gt;
    &lt;div class=&quot;chart&quot; id=&quot;chart&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;legend&quot;&gt;
      &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:var(--blue)&quot;&gt;&lt;/i&gt;Organic&lt;/span&gt;
      &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:var(--blue-20)&quot;&gt;&lt;/i&gt;Paid / promoted&lt;/span&gt;
    &lt;/div&gt;

    &lt;h3 style=&quot;margin-top:38px&quot;&gt;Concentration: three posts carried the month&lt;/h3&gt;
    &lt;p class=&quot;small&quot; style=&quot;margin-top:6px;max-width:70ch&quot;&gt;Of 276,040 founder impressions, 223,819 came from three posts — Denys's sanctions post (111K), Ihor's USDT/Revolut post (32.8K) and Egor's promoted post (~80K).&lt;/p&gt;
    &lt;div class=&quot;conc&quot;&gt;
      &lt;div class=&quot;a&quot; style=&quot;flex:81.1&quot;&gt;3 posts · 81%&lt;/div&gt;
      &lt;div class=&quot;b&quot; style=&quot;flex:18.9&quot;&gt;All other posts · 19%&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ops&quot;&gt;&lt;b&gt;Risk ·&lt;/b&gt; A month built on three posts is not a repeatable system. If any one of them had not landed, August reads as a decline, not a record.&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 3. FOUNDERS --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sechead&quot;&gt;&lt;span class=&quot;secnum&quot;&gt;03&lt;/span&gt;&lt;h2&gt;Founder profiles&lt;/h2&gt;&lt;/div&gt;
    &lt;p class=&quot;secsub&quot;&gt;LinkedIn, 28 days to 31 August. These three profiles are the distribution engine — company pages do not grow organically at this stage, so reach is routed through people.&lt;/p&gt;
    &lt;div class=&quot;cards&quot; id=&quot;founders&quot;&gt;&lt;/div&gt;

    &lt;h3 style=&quot;margin-top:40px&quot;&gt;Audience growth does not track reach&lt;/h3&gt;
    &lt;p class=&quot;small&quot; style=&quot;margin-top:6px;max-width:74ch&quot;&gt;The clearest pattern in the data — and it runs backwards. Ihor had the weakest month by reach and the strongest by conversion: 264 followers on 44.8K impressions, 5.9 per thousand. Denys converted at 2.5, Egor at 1.5 — and Egor's 128 came from small-reach organic posts, not from the ~80K promoted post that landed in the final days. Instagram lost followers on 1,814 views.&lt;/p&gt;
    &lt;div class=&quot;tablewrap&quot; style=&quot;margin-top:18px&quot;&gt;
      &lt;table style=&quot;min-width:520px&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Profile&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Impressions&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Followers gained&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Per 1,000 impressions&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Ihor Vlasov&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;44,864&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+264&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;5.9&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Denys Bets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;144,143&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+356&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2.5&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Egor Podkolzin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;87,033&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;+128&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.5&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;N5Deal · Instagram&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,814&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;−10&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ops&quot;&gt;&lt;b&gt;Do not conclude yet ·&lt;/b&gt; Egor's promoted post has had two days to work. Judging paid on this month's follower number would be premature — &lt;b&gt;re-measure at 30 days in the September report&lt;/b&gt; before drawing any conclusion about paid on founder profiles.&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 4. BRAND CHANNELS --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sechead&quot;&gt;&lt;span class=&quot;secnum&quot;&gt;04&lt;/span&gt;&lt;h2&gt;N5Deal brand channels&lt;/h2&gt;&lt;/div&gt;
    &lt;p class=&quot;secsub&quot;&gt;The owned accounts. LinkedIn carries the audience quality; X and Instagram are not currently returning the effort put into them.&lt;/p&gt;
    &lt;div class=&quot;cards&quot; id=&quot;brand&quot;&gt;&lt;/div&gt;

    &lt;h3 style=&quot;margin-top:40px&quot;&gt;X: listings versus commentary&lt;/h3&gt;
    &lt;p class=&quot;small&quot; style=&quot;margin-top:6px;max-width:74ch&quot;&gt;18 posts produced 942 impressions, zero link clicks and zero new followers across the month. Splitting them by type shows the format problem clearly.&lt;/p&gt;
    &lt;div class=&quot;tablewrap&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;table style=&quot;min-width:520px&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Post type&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Posts&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Impressions&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Avg / post&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Engagements&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Editorial / market commentary&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;11&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;727&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;66&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Licence listings (&quot;FOR SALE&quot;)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;215&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;31&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot; style=&quot;margin-top:12px&quot;&gt;Commentary earns roughly twice the reach of a listing on the same account. Listings are inventory posts on a channel with no buying audience yet.&lt;/p&gt;

    &lt;h3 style=&quot;margin-top:36px&quot;&gt;Not worked this month&lt;/h3&gt;
    &lt;p class=&quot;small&quot; style=&quot;margin-top:6px&quot;&gt;Deliberate, not neglected — recorded so the absence is visible in the trend line.&lt;/p&gt;
    &lt;div class=&quot;dormant&quot;&gt;
      &lt;span class=&quot;pill&quot;&gt;Telegram — no reporting pulled&lt;/span&gt;
      &lt;span class=&quot;pill&quot;&gt;Threads — analytics locked below 100 followers&lt;/span&gt;
      &lt;span class=&quot;pill&quot;&gt;YouTube — dormant&lt;/span&gt;
      &lt;span class=&quot;pill&quot;&gt;TikTok — launches October on SF footage&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 5. TOP CONTENT --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sechead&quot;&gt;&lt;span class=&quot;secnum&quot;&gt;05&lt;/span&gt;&lt;h2&gt;Top content of the month&lt;/h2&gt;&lt;/div&gt;
    &lt;p class=&quot;secsub&quot;&gt;Ranked by impressions across every account. &lt;span class=&quot;mine&quot;&gt;&lt;/span&gt; marks a post produced by N5Deal marketing.&lt;/p&gt;
    &lt;div class=&quot;tablewrap&quot;&gt;&lt;table id=&quot;top&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;ops&quot;&gt;&lt;b&gt;Attribution ·&lt;/b&gt; On Ihor's profile, one post produced 32,819 of 44,864 impressions — 73% of his entire month. The remaining 12,045 were spread across all other posts on that profile over 28 days, including seven published in the final week alone. Every post on the founder profiles that cleared 1,000 impressions this month came out of N5Deal marketing.&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 6. WHAT THE DATA SAYS --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sechead&quot;&gt;&lt;span class=&quot;secnum&quot;&gt;06&lt;/span&gt;&lt;h2&gt;What the data says&lt;/h2&gt;&lt;/div&gt;
    &lt;div class=&quot;finds&quot; id=&quot;finds&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 7. DECISIONS --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sechead&quot;&gt;&lt;span class=&quot;secnum&quot;&gt;07&lt;/span&gt;&lt;h2&gt;Decisions for September&lt;/h2&gt;&lt;/div&gt;
    &lt;p class=&quot;secsub&quot;&gt;Six calls that follow directly from the August numbers. Owners named where the decision is not marketing's to make.&lt;/p&gt;
    &lt;div class=&quot;dec&quot;&gt;&lt;ol id=&quot;dec&quot;&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- 08. SEARCH / SEO --&gt;
  &lt;section&gt;
    &lt;div class=&quot;sechead&quot;&gt;&lt;span class=&quot;secnum&quot;&gt;08&lt;/span&gt;&lt;h2&gt;Search, backlinks &amp;amp; AI visibility&lt;/h2&gt;&lt;/div&gt;

const $ = id =&gt; document.getElementById(id);

/* tiles */
$(&quot;tiles&quot;).innerHTML = REPORT.tiles.map(t =&gt; `
  &lt;div class=&quot;tile&quot;&gt;
    &lt;div class=&quot;lab&quot;&gt;${t.lab}&lt;/div&gt;
    &lt;div class=&quot;val num&quot;&gt;${t.val}${t.unit?`&lt;em&gt;${t.unit}&lt;/em&gt;`:&quot;&quot;}&lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;${t.note}&lt;/div&gt;
  &lt;/div&gt;`).join(&quot;&quot;);

/* chart */
(() =&gt; {
  const max = Math.max(...REPORT.chart.map(d =&gt; d.v));
  $(&quot;chart&quot;).innerHTML = REPORT.chart.map(d =&gt; {
    const w = d.v / max * 100;
    const paidW = d.paid ? d.paid / d.v * 100 : 0;
    const orgW = 100 - paidW;
    return `&lt;div class=&quot;row&quot; title=&quot;${d.nm} — ${d.v.toLocaleString('en-GB')} impressions&quot;&gt;
      &lt;div class=&quot;nm&quot;&gt;${d.nm}&lt;i&gt;${d.sub}&lt;/i&gt;&lt;/div&gt;
      &lt;div class=&quot;track&quot;&gt;&lt;div style=&quot;display:flex;gap:2px;width:${w}%&quot;&gt;
        ${orgW &gt; 0 ? `&lt;div class=&quot;bar&quot; style=&quot;flex:${orgW};border-radius:${paidW?0:'0 4px 4px 0'}&quot;&gt;&lt;/div&gt;` : &quot;&quot;}
        ${paidW &gt; 0 ? `&lt;div class=&quot;bar paid&quot; style=&quot;flex:${paidW};border-radius:0 4px 4px 0&quot;&gt;&lt;/div&gt;` : &quot;&quot;}
      &lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;v num&quot;&gt;${d.v.toLocaleString('en-GB')}&lt;/div&gt;
    &lt;/div&gt;`;
  }).join(&quot;&quot;);
})();

/* cards */
function cards(list){
  return list.map(c =&gt; `
    &lt;div class=&quot;card${c.accent ? &quot; accent&quot; : &quot;&quot;}&quot;&gt;
      &lt;div class=&quot;who&quot;&gt;&lt;h3&gt;${c.name}&lt;/h3&gt;${c.badge ? `&lt;span class=&quot;badge${c.badgeGrey ? &quot; grey&quot; : &quot;&quot;}&quot;&gt;${c.badge}&lt;/span&gt;` : &quot;&quot;}&lt;/div&gt;
      &lt;div class=&quot;role&quot;&gt;${c.role}&lt;/div&gt;
      ${c.kv.map(([k,v,dir,extra]) =&gt; `
        &lt;div class=&quot;kv&quot;&gt;&lt;span&gt;${k}&lt;/span&gt;&lt;b class=&quot;num&quot;&gt;&lt;span class=&quot;${!extra &amp;&amp; dir ? dir : &quot;&quot;}&quot;&gt;${v}&lt;/span&gt;${extra ? ` &lt;span class=&quot;${dir||&quot;&quot;}&quot; style=&quot;font-weight:500&quot;&gt;${extra}&lt;/span&gt;` : &quot;&quot;}&lt;/b&gt;&lt;/div&gt;`).join(&quot;&quot;)}
      &lt;div class=&quot;verdict&quot;&gt;${c.verdict}&lt;/div&gt;
    &lt;/div&gt;`).join(&quot;&quot;);
}
